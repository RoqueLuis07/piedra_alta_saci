<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ titulo }} — Piedra Alta</title>
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon/favicon-32.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    try {
      var temaGuardado = localStorage.getItem('tema');
      var prefiereOscuro = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (temaGuardado === 'oscuro' || (!temaGuardado && prefiereOscuro)) document.documentElement.classList.add('oscuro');
    } catch (e) {}
  </script>
  <style>
    :root {
      --verde-oscuro: #1F4D34;
      --verde-claro: #7FAE6B;
      --fondo: #FAFAF7;
      --texto: #14181A;
      --texto-secundario: #5B6560;
      --superficie: #FFFFFF;
      --sobre-oscuro: #FAFAF7;
      --sobre-claro: #14181A;
      color-scheme: light;
    }
    html.oscuro {
      color-scheme: dark;
      --fondo: #14181A;
      --texto: #EDEDE8;
      --texto-secundario: #97A199;
      --superficie: #1B211D;
    }
    * { box-sizing: border-box; border-radius: 0 !important; }
    html, body { margin: 0; height: 100%; background: var(--fondo); font-family: 'Public Sans', system-ui, sans-serif; color: var(--texto); }
    .envoltorio { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .panel { width: 100%; max-width: 400px; border: 1px solid var(--texto); background: var(--superficie); padding: 32px; }
    h1 { font-family: 'Source Serif 4', serif; font-size: 20px; font-weight: 600; margin: 0 0 12px; }
    p { font-size: 13.5px; line-height: 1.6; color: var(--texto-secundario); }
    a.boton { display: inline-block; border: 1px solid var(--texto); background: var(--verde-oscuro); color: var(--sobre-oscuro); padding: 10px 16px; font-size: 12.5px; font-weight: 600; letter-spacing: 0.04em; text-decoration: none; margin-top: 8px; }
    a.boton:hover { background: var(--verde-claro); border-color: var(--verde-claro); color: var(--sobre-claro); }
  </style>
</head>
<body>
  <div class="envoltorio">
    <div class="panel">
      <h1>{{ titulo }}</h1>
      <p>{{ mensaje }}</p>
      <a class="boton" href="javascript:history.back()">Volver</a>
    </div>
  </div>
</body>
</html>
