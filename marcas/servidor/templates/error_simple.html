<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ titulo }} — Piedra Alta</title>
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon/favicon-32.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --verde-oscuro:#1F4D34; --fondo:#FAFAF7; --texto:#14181A; --texto-secundario:#5B6560; }
    * { box-sizing: border-box; border-radius: 0 !important; }
    html, body { margin: 0; height: 100%; background: var(--fondo); font-family: 'Public Sans', system-ui, sans-serif; color: var(--texto); }
    .envoltorio { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .panel { width: 100%; max-width: 400px; border: 1px solid var(--texto); background: #fff; padding: 32px; }
    h1 { font-family: 'Source Serif 4', serif; font-size: 20px; font-weight: 600; margin: 0 0 12px; }
    p { font-size: 13.5px; line-height: 1.6; color: var(--texto-secundario); }
    a.boton { display: inline-block; border: 1px solid var(--texto); background: var(--verde-oscuro); color: var(--fondo); padding: 10px 16px; font-size: 12.5px; font-weight: 600; letter-spacing: 0.04em; text-decoration: none; margin-top: 8px; }
    a.boton:hover { background: #7FAE6B; border-color: #7FAE6B; color: var(--texto); }
  </style>
</head>
<body>
  <div class="envoltorio">
    <div class="panel">
      <h1>{{ titulo }}</h1>
      <p>{{ mensaje }}</p>
      <a class="boton" href="javascript:history.back()">Volver</a>
    </div>
  </div>
</body>
</html>
