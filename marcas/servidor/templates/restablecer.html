<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nueva contraseña — Piedra Alta</title>
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon/favicon-32.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --verde-oscuro:#1F4D34; --dorado:#F2C230; --fondo:#FAFAF7; --texto:#14181A; --texto-secundario:#5B6560; }
    * { box-sizing: border-box; border-radius: 0 !important; }
    html, body { margin: 0; height: 100%; background: var(--fondo); font-family: 'Public Sans', system-ui, sans-serif; color: var(--texto); }
    .envoltorio { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .panel { width: 100%; max-width: 380px; border: 1px solid var(--texto); background: #fff; padding: 32px; }
    .logo { width: 58px; margin-bottom: 16px; }
    h1 { font-family: 'Source Serif 4', serif; font-size: 22px; font-weight: 600; margin: 0 0 4px; }
    .sub { font-size: 12px; letter-spacing: 0.1em; color: var(--texto-secundario); text-transform: uppercase; margin-bottom: 26px; }
    label { display: block; margin-bottom: 16px; font-size: 12px; letter-spacing: 0.06em; color: var(--texto-secundario); text-transform: uppercase; }
    input { width: 100%; border: 1px solid var(--texto); padding: 10px; font-size: 14px; margin-top: 6px; font-family: inherit; }
    button { width: 100%; background: var(--verde-oscuro); color: var(--fondo); border: 1px solid var(--verde-oscuro); padding: 12px; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; cursor: pointer; margin-top: 6px; transition: background .15s, border-color .15s, color .15s; }
    button:hover { background: #7FAE6B; border-color: #7FAE6B; color: var(--texto); }
    .error { color: #a63244; font-size: 13px; margin-bottom: 16px; }
    .volver { display: block; text-align: center; margin-top: 16px; font-size: 12px; color: var(--texto-secundario); text-decoration: none; }
    .volver:hover { color: var(--verde-oscuro); text-decoration: underline; }
    .aviso { font-size: 13px; line-height: 1.6; color: var(--texto-secundario); }
  </style>
</head>
<body>
  <div class="envoltorio">
    <div class="panel">
      <img class="logo" src="{{ url_for('static', filename='logo/emblema_oscuro.png') }}" alt="Estancia La Patricia">
      <h1>Elegí una nueva contraseña</h1>
      <div class="sub">Registro de marcas</div>
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <div id="sin-token" style="display:none;">
        <p class="aviso">El enlace no es válido o venció. Pedí uno nuevo.</p>
        <a class="volver" href="{{ url_for('recuperar') }}">Solicitar enlace nuevo</a>
      </div>
      <form id="form-nueva" method="post" action="{{ url_for('restablecer_post') }}" style="display:none;">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="access_token" id="access_token">
        <input type="hidden" name="refresh_token" id="refresh_token">
        <label>Nueva contraseña<input type="password" name="nueva_contrasena" minlength="6" required autofocus></label>
        <button type="submit">Guardar contraseña</button>
      </form>
    </div>
  </div>
  <script>
    (function () {
      var hash = window.location.hash.substring(1);
      var params = new URLSearchParams(hash);
      var accessToken = params.get('access_token');
      var refreshToken = params.get('refresh_token');
      if (accessToken && refreshToken) {
        document.getElementById('access_token').value = accessToken;
        document.getElementById('refresh_token').value = refreshToken;
        document.getElementById('form-nueva').style.display = 'block';
      } else {
        document.getElementById('sin-token').style.display = 'block';
      }
    })();
  </script>
</body>
</html>
