{% extends "base.html" %}
{% block titulo %}Usuarios{% endblock %}
{% block migaja %}REGISTRO DE MARCAS · ADMINISTRACIÓN{% endblock %}
{% block titulo_pagina %}Usuarios{% endblock %}

{% block contenido %}
<div class="contenido">
  <table class="registro" style="margin-top: 22px;">
    <thead>
      <tr>
        <th style="padding-left: 28px;">NOMBRE</th>
        <th>ROL</th>
        <th>ACTIVO</th>
        <th style="padding-right: 28px;"></th>
      </tr>
    </thead>
    <tbody>
      {% for u in usuarios %}
      <tr>
        <td style="padding-left: 28px;">{{ u.nombre }}</td>
        <td colspan="3" style="padding: 0;">
          <form method="post" action="{{ url_for('actualizar_usuario', usuario_id=u.id) }}" style="display: flex; gap: 10px; align-items: center; padding: 9px 10px;">
            <select name="rol" style="border: 1px solid var(--texto); padding: 6px;">
              {% for r in ['consulta', 'operador', 'administrador'] %}
              <option value="{{ r }}" {% if u.rol == r %}selected{% endif %}>{{ r }}</option>
              {% endfor %}
            </select>
            <select name="activo" style="border: 1px solid var(--texto); padding: 6px;">
              <option value="1" {% if u.activo %}selected{% endif %}>Activo</option>
              <option value="0" {% if not u.activo %}selected{% endif %}>Inactivo</option>
            </select>
            <button type="submit" class="boton" style="min-height: auto; padding: 7px 14px;">Guardar</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
